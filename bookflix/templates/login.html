{% extends "base.html" %}

{% block content %}
<h2>Connexion</h2>
<video id="preview" width="300" height="200" autoplay playsinline muted></video>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<script>
    window.addEventListener('load', () => {
        const previewElem = document.getElementById('preview');
        // Ensure autoplay policy allows playback in PWA
        previewElem.muted = true;
        previewElem.setAttribute('muted', '');
        previewElem.setAttribute('playsinline', '');
        previewElem.setAttribute('autoplay', '');
        // If autoplay is still blocked, a tap will resume playback
        previewElem.addEventListener('click', () => {
            if (previewElem.paused) {
                previewElem.play().catch(() => {});
            }
        }, { once: false });
        const codeReader = new ZXingBrowser.BrowserQRCodeReader();
        codeReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, previewElem, (result, err, controls) => {
            if (result) {
                controls.stop();
                try {
                    const text = result.text || result.getText();
                    const data = JSON.parse(text);
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/login';
                    const user = document.createElement('input');
                    user.type = 'hidden';
                    user.name = 'username';
                    user.value = data.user;
                    const pass = document.createElement('input');
                    pass.type = 'hidden';
                    pass.name = 'password';
                    pass.value = data.passwd;
                    form.appendChild(user);
                    form.appendChild(pass);
                    document.body.appendChild(form);
                    form.submit();
                    showLoader();
                } catch (e) {
                    console.error(e);
                }
            } else if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
                console.error('Camera/decoder error:', err);
            }
        });
    });
</script>
{% endblock %}
